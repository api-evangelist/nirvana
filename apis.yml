description: Nirvana is a real-time insurance eligibility, benefits, and patient
  cost-estimation platform purpose-built for behavioral and mental health. Its
  Coverage API normalizes complex payer data into structured JSON, returning
  eligibility, plan-level benefits, patient cost-share, session limits, and prior
  authorization details, and can recover active coverage from only basic patient
  demographics.
