publisherName: Nirvana Health
serviceCategory: Healthcare and Insurance
billingModel:
  pricingCategory: Commitment-Based
  billingFrequency: Negotiated
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Nirvana Coverage API
  ServiceCategory: Healthcare and Insurance
  ProviderName: Nirvana Health
  PublisherName: Nirvana Health
  InvoiceIssuerName: Nirvana Health
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Commitment-Based
meters:
- name: coverage_checks
  description: Eligibility/coverage discovery calls (discover, scan, medicaid). Rate not publicly disclosed.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - office_id
  - provider_npi
- name: cost_estimates
  description: Real-time patient cost estimate calls (estimate). Rate not publicly disclosed.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - office_id
  - provider_npi
- name: monitored_appointments
  description: Upcoming appointments under continuous benefit monitoring. Rate not publicly disclosed.
  unit: appointments
  aggregation: sum
  dimensions:
  - account
  - office_id
principles:
- name: Visibility
  description: Track coverage-check and estimate call volume; attribute via office_id and provider_npi.
- name: Allocation
  description: Map verification spend to locations, providers, and patient intake workflows.
- name: Optimization
  description: Use Cardless Verification to reduce failed checks; tune monitoring cadence to avoid redundant re-checks.
- name: Accountability
  description: Reconcile contracted rates against actual call volume each billing period.
maintainers:
