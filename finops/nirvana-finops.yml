description: >-
  FinOps view of Nirvana Coverage API and Eligibility Management Platform spend.
  Nirvana is sold under negotiated commercial agreements rather than public
  usage-based rates, so unit economics (per coverage check, per estimate, per
  seat, or platform subscription) are not publicly disclosed. The natural cost
  drivers are coverage checks (discover, scan, medicaid) and cost estimates,
  which map to verification volume and upcoming-appointment monitoring cadence.
  Quantitative meter rates are not reconciled in this artifact.
notes: >-
  Obtain the contracted pricing schedule and any volume tiers from Nirvana to
  reconcile per-unit costs. Allocate spend by office_id and provider_npi, which
  are accepted on requests and support per-location and per-provider attribution.
sources:
- https://www.meetnirvana.com/our-technology
- https://nirvana-docs.readme.io/docs/nirvana-overview-v2
